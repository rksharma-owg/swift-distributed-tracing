name: WASI CMake layout preflight
'on':
  workflow_dispatch:
    inputs:
      patch_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  wasi-cmake:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.0-noble
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify exact tested contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'set -euo pipefail

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller'
    - name: Install CMake and the checksummed Swift WASI SDK
      shell: bash
      run: 'set -euo pipefail

        apt-get update -qq

        apt-get install -y python3-venv ninja-build curl file

        python3 -m venv /tmp/cmake-env

        /tmp/cmake-env/bin/pip install cmake==4.4.3

        echo /tmp/cmake-env/bin >> "$GITHUB_PATH"

        curl -fL --retry 3 https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
        -o /tmp/wasi.tar.gz

        echo ''f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d  /tmp/wasi.tar.gz'' | sha256sum
        -c -

        mkdir /tmp/wasi-sdk

        tar -xzf /tmp/wasi.tar.gz -C /tmp/wasi-sdk

        '
    - name: Build and install WASI libraries and link the independent consumer
      shell: bash
      run: 'set -euo pipefail

        sdk=/tmp/wasi-sdk/swift-6.4.0-RELEASE_wasm.artifactbundle/swift-6.4.0-RELEASE_wasm/wasm32-unknown-wasip1

        cat > /tmp/wasi.cmake <<CMAKE

        set(CMAKE_SYSTEM_NAME WASI)

        set(CMAKE_SYSTEM_PROCESSOR wasm32)

        set(CMAKE_C_COMPILER clang)

        set(CMAKE_C_COMPILER_TARGET wasm32-unknown-wasip1)

        set(CMAKE_Swift_COMPILER swiftc)

        set(CMAKE_Swift_COMPILER_TARGET wasm32-unknown-wasip1)

        set(CMAKE_SYSROOT "$sdk/WASI.sdk")

        set(CMAKE_Swift_FLAGS "-target wasm32-unknown-wasip1 -sdk $sdk/WASI.sdk -resource-dir $sdk/swift.xctoolchain/usr/lib/swift_static
        -static-stdlib -Xclang-linker -resource-dir -Xclang-linker $sdk/swift.xctoolchain/usr/lib/clang")

        set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)

        CMAKE

        swift --version

        cmake --version

        cmake -S . -B /tmp/library -G Ninja -DCMAKE_TOOLCHAIN_FILE=/tmp/wasi.cmake -DCMAKE_INSTALL_PREFIX=/tmp/prefix

        grep -q ''BUILD_SHARED_LIBS:BOOL=OFF'' /tmp/library/CMakeCache.txt

        cmake --build /tmp/library --verbose

        cmake --install /tmp/library

        cmake -S Tests/CMake -B /tmp/consumer -G Ninja -DCMAKE_TOOLCHAIN_FILE=/tmp/wasi.cmake -DCMAKE_PREFIX_PATH=/tmp/prefix

        cmake --build /tmp/consumer --verbose

        file /tmp/consumer/CMakeConsumer*

        '
